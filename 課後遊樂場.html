  ctrl:'WASD 移動 · 滑鼠瞄準、按住左鍵射擊（E 自動射擊）· 數字 1–6 升級 · 手機：左側搖桿、右側瞄準射擊',
  hud:['等級','分數','砲型','升級點'],
  hints:'<span><b>WASD</b> 移動</span><span><b>滑鼠</b> 瞄準，按住射擊，<b>E</b> 自動射擊</span><span><b>1–6</b> 或點左下角升級能力</span><span>10 級可以選進化</span>',
  make(D,V){
  V=V||{};
  const WW=Math.round(2400*(V.world||1)), WH=Math.round(2400*(V.world||1));
  const STN=['生命回復','生命上限','子彈速度','子彈傷害','裝填速度','移動速度'];
  const CLASSES={
    twin:{n:'雙管砲',d:'兩根砲管同時開火，火力覆蓋更廣。'},
    sniper:{n:'狙擊砲',d:'子彈又快又痛，射程拉遠，但裝填較慢。'},
    mg:{n:'機關槍',d:'裝填超快、彈幕散射，近距離很兇。'},
    flank:{n:'前後砲',d:'前後各一門砲，被繞背也不怕。'}
  };
  const CN={basic:'基本砲',twin:'雙管砲',sniper:'狙擊砲',mg:'機關槍',flank:'前後砲'};
  const NAMES=['小鐵','阿砲','圓圓','鐵頭','轟轟','咚咚','阿彈','碰碰','鐵蛋','大炮'];
  const S={shapes:[],bul:[],tanks:[],me:null,t:0,over:false,auto:false,msg:'',msgT:0,kills:0};
  const need=L=>Math.round(12+(L-1)*12+(L-1)*(L-1)*2.4);
  function st(t){ const s=t.st; return {regen:1.2+s[0]*1.5,max:100+s[1]*28,bspd:560+s[2]*62,dmg:9+s[3]*3.3,reload:.52*(1-s[4]*.075),spd:240+s[5]*17}; }
  function mkTank(name,col,x,y,isMe,lv){
    const t={name,col,x,y,vx:0,vy:0,aim:0,hp:100,lv:1,xp:0,score:0,pts:0,st:[0,0,0,0,0,0],cls:'basic',
      reload:0,isMe,dead:false,hitT:9,alt:0,ai:{t:0,mode:'farm',tgt:null,wx:x,wy:y},kills:0};
    for(let i=1;i<(lv||1);i++) gain(t,need(t.lv),true);
    t.hp=st(t).max;
    return t;
  }
  function spend(t,i){
    if(t.pts<=0||t.st[i]>=7) return false;
    t.st[i]++; t.pts--;
    if(i===1) t.hp+=28;
    return true;
  }
  function autoSpend(t){
    const w=[1,2,2,4,4,2];
    let guard=40;
    while(t.pts>0&&guard--){
      let tot=0; w.forEach((v,i)=>{ if(t.st[i]<7) tot+=v; });
      let r=Math.random()*tot, pickI=0;
      for(let i=0;i<6;i++){ if(t.st[i]>=7) continue; r-=w[i]; if(r<=0){ pickI=i; break; } }
      if(!spend(t,pickI)) break;
    }
  }
  function gain(t,v,silent){
    t.xp+=v; t.score+=v;
    while(t.lv<30&&t.xp>=need(t.lv)){
      t.xp-=need(t.lv); t.lv++; t.pts++;
      if(t.isMe&&!silent){ S.msg='升到 '+t.lv+' 級！'; S.msgT=1.1; Snd.power(); }
      if(t.lv>=10&&t.cls==='basic'){
        if(t.isMe&&!silent){ evolve(); }
        else if(!t.isMe) t.cls=pick(['twin','sniper','mg','flank']);
      }
    }
    if(!t.isMe) autoSpend(t);
  }
  function evolve(){
    const opts=Object.keys(CLASSES).map(k=>({name:CLASSES[k].n,desc:CLASSES[k].d,k}));
    showChoice('坦克可以進化了！','選一種砲型，之後就不能換。',opts,o=>{ S.me.cls=o.k; S.msg='進化成 '+CLASSES[o.k].n; S.msgT=1.6; },'EVOLVE / 進化');
  }
  const SHP={sq:{r:15,hp:10,xp:10,col:'#ffd83d',dk:'#b39a1e',n:4},tri:{r:18,hp:30,xp:25,col:'#ff7a7a',dk:'#b34d4d',n:3},pen:{r:28,hp:100,xp:130,col:'#7aa7ff',dk:'#4d6ab3',n:5}};
  function addShape(k){
    const d=SHP[k];
    S.shapes.push({k,x:rnd(60,WW-60),y:rnd(60,WH-60),r:d.r,hp:d.hp,max:d.hp,rot:rnd(0,TAU),vr:rnd(-.6,.6),vx:rnd(-8,8),vy:rnd(-8,8),hitT:9});
  }
  const QM=V.shapes||1, QW=(V.world||1)*(V.world||1);
  const QUOTA=V.quota?Object.assign({},V.quota):{sq:Math.round(110*QM*QW),tri:Math.round(45*QM*QW),pen:Math.round(16*QM*QW)};
  for(const k in QUOTA) for(let i=0;i<QUOTA[k];i++) addShape(k);
  S.me=mkTank('你','#5fb8ff',WW/2,WH/2,true,V.lv||1);
  if(V.cls) S.me.cls=V.cls;
  S.tanks.push(S.me);
  const NB=Math.max(1,Math.round((D.key==='easy'?5:D.key==='hard'?10:7)*(V.bots||1)));
  const TCOL=['#ff5f96','#57e2a5','#c18cff','#ff9d4d','#ff7a7a','#5fd6e0'];
  function spawnBot(){
    let x,y; do{ x=rnd(150,WW-150); y=rnd(150,WH-150); }while(Math.hypot(x-S.me.x,y-S.me.y)<700);
    S.tanks.push(mkTank(pick(NAMES),pick(TCOL),x,y,false,rint(V.botLv?V.botLv[0]:1,V.botLv?V.botLv[1]:(D.key==='hard'?12:7))));
  }
  for(let i=0;i<NB;i++) spawnBot();
  function barrels(t){
    const c=t.cls;
    if(c==='twin') return [{o:-9,a:0,l:30,w:12},{o:9,a:0,l:30,w:12}];
    if(c==='sniper') return [{o:0,a:0,l:42,w:13}];
    if(c==='mg') return [{o:0,a:0,l:28,w:20,flare:1}];
    if(c==='flank') return [{o:0,a:0,l:32,w:14},{o:0,a:Math.PI,l:26,w:13}];
    return [{o:0,a:0,l:32,w:14}];
  }
  function shoot(t){
    const s=st(t), c=t.cls;
    let reload=s.reload, dmg=s.dmg, bs=s.bspd, br=8, spread=.04;
    if(c==='twin'){ dmg*=.68; reload*=.95; }
    if(c==='sniper'){ dmg*=1.6; reload*=1.75; bs*=1.55; br=7; spread=.01; }
    if(c==='mg'){ dmg*=.6; reload*=.45; br=7; spread=.2; }
    if(c==='flank'){ dmg*=.85; }
    t.reload=reload;
    for(const b of barrels(t)){
      const a=t.aim+b.a+rnd(-spread,spread);
      const bx=t.x+Math.cos(t.aim+b.a)*b.l+Math.cos(t.aim+Math.PI/2)*b.o;
      const by=t.y+Math.sin(t.aim+b.a)*b.l+Math.sin(t.aim+Math.PI/2)*b.o;
      S.bul.push({x:bx,y:by,vx:Math.cos(a)*bs,vy:Math.sin(a)*bs,r:br,dmg:dmg*(b.a?.7:1),pen:dmg*1.4,life:1.6,own:t,col:t.col});
    }
    if(t.isMe) Snd.shoot();
  }
  function hurt(t,d,by){
    if(t.dead) return;
    t.hp-=d; t.hitT=0;
    if(t.hp<=0){
      t.dead=true;
      if(by&&by!==t){ gain(by,Math.max(25,Math.round(t.score*.45)+t.lv*6)); by.kills++;
        if(by.isMe){ S.kills++; Snd.boom(); ftext(W/2,H/2-80,'擊倒 '+t.name+'！','#57e2a5'); } }
      if(t.isMe){
        S.over=true; shake(18); Snd.hurt();
        gameOver({score:Math.round(t.score),win:false,title:'坦克被擊毀了',
          stats:[['等級',t.lv],['砲型',CN[t.cls]],['擊倒',S.kills],['存活',Math.floor(S.t)+'s']]});
      }
    }
  }
  function aiThink(t,dt){
    const A=t.ai; A.t-=dt;
    const s=st(t);
    if(A.t<=0){
      A.t=rnd(.25,.5);
      let foe=null,fd=1e9;
      for(const o of S.tanks){ if(o===t||o.dead) continue; const d=Math.hypot(o.x-t.x,o.y-t.y); if(d<fd){ fd=d; foe=o; } }
      if(t.hp<s.max*.32&&foe&&fd<520){ A.mode='flee'; A.tgt=foe; }
      else if(foe&&fd<520&&(t.lv>=foe.lv-3||Math.random()<.3)){ A.mode='fight'; A.tgt=foe; }
      else {
        let best=null,bv=-1;
        for(const sh of S.shapes){ const d=Math.hypot(sh.x-t.x,sh.y-t.y); if(d>650) continue;
          const v=SHP[sh.k].xp/(d+60); if(v>bv){ bv=v; best=sh; } }
        A.mode=best?'farm':'wander'; A.tgt=best;
        if(!best&&Math.hypot(A.wx-t.x,A.wy-t.y)<80){ A.wx=rnd(200,WW-200); A.wy=rnd(200,WH-200); }
      }
    }
    let mx=0,my=0,fire=false;
    const T=A.tgt;
    if(A.mode==='flee'&&T&&!T.dead){ mx=t.x-T.x; my=t.y-T.y; t.aim=Math.atan2(T.y-t.y,T.x-t.x); fire=true; }
    else if(A.mode==='fight'&&T&&!T.dead){
      const d=Math.hypot(T.x-t.x,T.y-t.y), lead=d/st(t).bspd;
      const px=T.x+T.vx*lead, py=T.y+T.vy*lead;
      t.aim=Math.atan2(py-t.y,px-t.x)+rnd(-.12,.12)/D.rate;
      if(d>360){ mx=T.x-t.x; my=T.y-t.y; } else if(d<240){ mx=t.x-T.x; my=t.y-T.y; }
      else { mx=-(T.y-t.y); my=T.x-t.x; }
      fire=true;
    }
    else if(A.mode==='farm'&&T&&T.hp>0&&S.shapes.includes(T)){
      const d=Math.hypot(T.x-t.x,T.y-t.y);
      t.aim=Math.atan2(T.y-t.y,T.x-t.x);
      if(d>230){ mx=T.x-t.x; my=T.y-t.y; }
      fire=d<560;
    }
    else { mx=A.wx-t.x; my=A.wy-t.y; }
    const m=Math.hypot(mx,my);
    return {mx:m?mx/m:0,my:m?my/m:0,fire};
  }
  function panelRow(i){ return {x:14,y:H-18-(6-i)*24,w:196,h:20}; }
  return {
  onDown(x,y,id){
    const q=PTRS.get(id);
    for(let i=0;i<6;i++){ const r=panelRow(i);
      if(x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h){ if(spend(S.me,i)) Snd.good(); if(q) q.role='ui'; return; } }
    if(q) q.role=(P.touch&&x<W*.4)?'move':'aim';
  },
  update(dt){
    if(S.over) return;
    S.t+=dt;
    if(S.msgT>0) S.msgT-=dt;
    const me=S.me, ms=st(me);
    for(let i=0;i<6;i++) if(tapped.has(String(i+1))&&spend(me,i)) Snd.good();
    if(tapped.has('e')){ S.auto=!S.auto; S.msg=S.auto?'自動射擊：開':'自動射擊：關'; S.msgT=.9; }
    let ax=0,ay=0,fire=S.auto||keys.has(' ');
    const a=axis(); ax=a.x; ay=a.y;
    let aimSet=false;
    PTRS.forEach(q=>{
      if(q.role==='move'){ const dx=q.x-q.sx, dy=q.y-q.sy, m=Math.hypot(dx,dy); if(m>8){ ax=dx/Math.max(m,50); ay=dy/Math.max(m,50); } }
      if(q.role==='aim'){ fire=true; if(P.touch){ me.aim=Math.atan2(q.y-H/2,q.x-W/2); aimSet=true; } }
    });
    if(!P.touch&&!aimSet) me.aim=Math.atan2(P.y-H/2,P.x-W/2);
    const acc=ms.spd*7;
    me.vx+=ax*acc*dt; me.vy+=ay*acc*dt;
    for(const t of S.tanks){
      if(t.dead) continue;
      const s=st(t);
      if(!t.isMe){
        const o=aiThink(t,dt);
        t.vx+=o.mx*s.spd*6*dt*D.spd; t.vy+=o.my*s.spd*6*dt*D.spd;
        if(o.fire&&t.reload<=0) shoot(t);
      }else if(fire&&t.reload<=0) shoot(t);
      t.reload-=dt;
      const sp=Math.hypot(t.vx,t.vy), cap=s.spd*(t.isMe?1:D.spd);
      if(sp>cap){ t.vx*=cap/sp; t.vy*=cap/sp; }
      t.vx*=Math.pow(.02,dt); t.vy*=Math.pow(.02,dt);
      t.x=clamp(t.x+t.vx*dt,20,WW-20); t.y=clamp(t.y+t.vy*dt,20,WH-20);
      t.hitT+=dt;
      t.hp=Math.min(s.max,t.hp+(t.hitT>4?s.regen*3:s.regen*.35)*dt);
    }
    for(const sh of S.shapes){
      sh.rot+=sh.vr*dt; sh.x+=sh.vx*dt; sh.y+=sh.vy*dt; sh.hitT+=dt;
      if(sh.x<30||sh.x>WW-30) sh.vx=-sh.vx; if(sh.y<30||sh.y>WH-30) sh.vy=-sh.vy;
      for(const t of S.tanks){
        if(t.dead) continue;
        const d=Math.hypot(t.x-sh.x,t.y-sh.y), rr=26+sh.r;
        if(d<rr){
          const nx=(t.x-sh.x)/(d||1), ny=(t.y-sh.y)/(d||1);
          t.vx+=nx*260*dt*8; t.vy+=ny*260*dt*8; sh.vx-=nx*40*dt; sh.vy-=ny*40*dt;
          hurt(t,22*dt,null); sh.hp-=32*dt; sh.hitT=0;
          if(sh.hp<=0){ sh.dead=true; gain(t,SHP[sh.k].xp); }
        }
      }
    }
    for(let i=0;i<S.tanks.length;i++) for(let j=i+1;j<S.tanks.length;j++){
      const A=S.tanks[i], B=S.tanks[j]; if(A.dead||B.dead) continue;
      const d=Math.hypot(A.x-B.x,A.y-B.y);
      if(d<52){ const nx=(A.x-B.x)/(d||1), ny=(A.y-B.y)/(d||1);
        A.vx+=nx*300*dt*6; A.vy+=ny*300*dt*6; B.vx-=nx*300*dt*6; B.vy-=ny*300*dt*6;
        hurt(A,30*dt,B); hurt(B,30*dt,A); }
    }
    for(const b of S.bul){
      b.x+=b.vx*dt; b.y+=b.vy*dt; b.life-=dt;
      if(b.life<=0||b.x<0||b.y<0||b.x>WW||b.y>WH){ b.dead=true; continue; }
      for(const sh of S.shapes){
        if(sh.dead) continue;
        if(Math.abs(sh.x-b.x)<sh.r+b.r&&Math.abs(sh.y-b.y)<sh.r+b.r&&Math.hypot(sh.x-b.x,sh.y-b.y)<sh.r+b.r){
          sh.hp-=b.dmg; sh.hitT=0; b.pen-=8; sh.vx+=b.vx*.02; sh.vy+=b.vy*.02;
          if(sh.hp<=0){ sh.dead=true; if(!b.own.dead) gain(b.own,SHP[sh.k].xp);
            if(b.own.isMe) boom((sh.x-S.me.x)+W/2,(sh.y-S.me.y)+H/2,SHP[sh.k].col,8,140); }
          if(b.pen<=0){ b.dead=true; break; }
        }
      }
      if(b.dead) continue;
      for(const t of S.tanks){
        if(t===b.own||t.dead) continue;
        if(Math.hypot(t.x-b.x,t.y-b.y)<26+b.r){ hurt(t,b.dmg,b.own); b.dead=true; if(t.isMe) shake(4); break; }
      }
    }
    if(S.over) return;
    S.bul=S.bul.filter(b=>!b.dead);
    S.shapes=S.shapes.filter(s=>!s.dead);
    const cnt={sq:0,tri:0,pen:0}; S.shapes.forEach(s=>cnt[s.k]++);
    for(const k in QUOTA) if(cnt[k]<QUOTA[k]&&Math.random()<dt*3) addShape(k);
    S.tanks=S.tanks.filter(t=>!t.dead);
    if(S.tanks.length<NB+1&&Math.random()<dt*.35) spawnBot();
    S.board=S.tanks.slice().sort((a,b)=>b.score-a.score).slice(0,5);
    setHUD({'等級':me.lv,'分數':Math.round(me.score),'砲型':CN[me.cls],'升級點':{t:me.pts,c:me.pts?'acc':''}});
  },
  draw(){
    const me=S.me;
    const z=me.cls==='sniper'?.82:1;
    ctx.fillStyle='#0a0f26'; ctx.fillRect(0,0,W,H);
    ctx.save(); ctx.translate(W/2,H/2); ctx.scale(z,z); ctx.translate(-me.x,-me.y);
    ctx.fillStyle='#10163a'; ctx.fillRect(0,0,WW,WH);
    ctx.strokeStyle='rgba(122,167,255,.08)'; ctx.lineWidth=1; ctx.beginPath();
    const vx0=me.x-W/2/z, vy0=me.y-H/2/z, vx1=me.x+W/2/z, vy1=me.y+H/2/z;
    for(let x=Math.max(0,Math.floor(vx0/40)*40);x<=Math.min(WW,vx1);x+=40){ ctx.moveTo(x,Math.max(0,vy0)); ctx.lineTo(x,Math.min(WH,vy1)); }
    for(let y=Math.max(0,Math.floor(vy0/40)*40);y<=Math.min(WH,vy1);y+=40){ ctx.moveTo(Math.max(0,vx0),y); ctx.lineTo(Math.min(WW,vx1),y); }
    ctx.stroke();
    ctx.strokeStyle='#ff5f96'; ctx.lineWidth=6; ctx.strokeRect(0,0,WW,WH);
    for(const sh of S.shapes){
      if(sh.x<vx0-40||sh.x>vx1+40||sh.y<vy0-40||sh.y>vy1+40) continue;
      const d=SHP[sh.k];
      ctx.save(); ctx.translate(sh.x,sh.y); ctx.rotate(sh.rot);
      ctx.fillStyle=sh.hitT<.08?'#fff':d.col; ctx.strokeStyle=d.dk; ctx.lineWidth=3;
      ctx.beginPath(); for(let i=0;i<d.n;i++){ const a=i*TAU/d.n; const px=Math.cos(a)*sh.r, py=Math.sin(a)*sh.r; i?ctx.lineTo(px,py):ctx.moveTo(px,py); }
      ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.restore();
      if(sh.hp<sh.max){ ctx.fillStyle='rgba(0,0,0,.5)'; ctx.fillRect(sh.x-sh.r,sh.y+sh.r+5,sh.r*2,4);
        ctx.fillStyle='#57e2a5'; ctx.fillRect(sh.x-sh.r,sh.y+sh.r+5,sh.r*2*sh.hp/sh.max,4); }
    }
    for(const b of S.bul){
      ctx.fillStyle=b.col; ctx.strokeStyle='rgba(0,0,0,.35)'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,TAU); ctx.fill(); ctx.stroke();
    }
    for(const t of S.tanks){
      if(t.x<vx0-80||t.x>vx1+80||t.y<vy0-80||t.y>vy1+80) continue;
      ctx.save(); ctx.translate(t.x,t.y); ctx.rotate(t.aim);
      ctx.fillStyle='#9aa3c7'; ctx.strokeStyle='#5d6690'; ctx.lineWidth=3;
      for(const b of barrels(t)){
        ctx.save(); ctx.rotate(b.a);
        if(b.flare){ ctx.beginPath(); ctx.moveTo(0,-b.w/3+b.o); ctx.lineTo(b.l,-b.w/2+b.o); ctx.lineTo(b.l,b.w/2+b.o); ctx.lineTo(0,b.w/3+b.o); ctx.closePath(); ctx.fill(); ctx.stroke(); }
        else { ctx.fillRect(0,b.o-b.w/2,b.l,b.w); ctx.strokeRect(0,b.o-b.w/2,b.l,b.w); }
        ctx.restore();
      }
      ctx.restore();
      ctx.fillStyle=t.hitT<.08?'#fff':t.col; ctx.strokeStyle='rgba(0,0,0,.35)'; ctx.lineWidth=3;
      ctx.beginPath(); ctx.arc(t.x,t.y,24,0,TAU); ctx.fill(); ctx.stroke();
      const s=st(t);
      if(t.hp<s.max){ ctx.fillStyle='rgba(0,0,0,.5)'; ctx.fillRect(t.x-26,t.y+32,52,6);
        ctx.fillStyle=t.hp<s.max*.3?'#ff5f96':'#57e2a5'; ctx.fillRect(t.x-26,t.y+32,52*t.hp/s.max,6); }
      ctx.fillStyle='#eaf0ff'; ctx.font='700 12px '+FONT_TC; ctx.textAlign='center';
      ctx.fillText(t.name+'  Lv'+t.lv,t.x,t.y-34); ctx.textAlign='left';
    }
    ctx.restore();
    /* 經驗條 */
    const xpw=360, xr=me.lv>=30?1:me.xp/need(me.lv);
    ctx.fillStyle='rgba(6,10,26,.8)'; RR(W/2-xpw/2-4,H-34,xpw+8,24,12); ctx.fill();
    ctx.fillStyle='#ffd83d'; RR(W/2-xpw/2,H-30,xpw*xr,16,8); ctx.fill();
    ctx.fillStyle='#eaf0ff'; ctx.font='700 11px '+FONT_TC; ctx.textAlign='center';
    ctx.fillText('Lv '+me.lv+'　'+CN[me.cls]+'　分數 '+Math.round(me.score),W/2,H-18); ctx.textAlign='left';
    /* 升級面板 */

        if(fed){ Snd.power(); boom(W/2+(CX-S.p.x),H/2+(CY-S.p.y)-10,'#ffb347',20,220); toast('🔥 添了 '+fed+' 份燃料（營火 Lv'+fireLv()+'）'); }
        else if(S.fire.fuel>=100) toast('營火已經很旺了');
        else toast('背包裡沒有木頭或煤塊');
      }
    }
    function eat(){
      if(S.inv.berry>0&&S.p.food<100){ S.inv.berry--; S.p.food=Math.min(100,S.p.food+22); S.p.hp=Math.min(S.p.max,S.p.hp+8); Snd.good(); ftext(W/2,H/2-40,'+22 飽食','#ff5f96'); }
      else if(!S.inv.berry) toast('沒有莓果了，去找紅色莓果叢');
    }
    function toggleLight(){
      if(!S.light.on&&S.light.bat<=1){ toast('手電筒沒電了：回營火旁邊充電'); Snd.bad(); return; }
      S.light.on=!S.light.on; Snd.hit();
    }

    /* ───── 相機 ───── */
    let cam={x:S.p.x,y:S.p.y};
    const camX=()=>cam.x, camY=()=>cam.y;
    const SX=x=>x-cam.x+W/2, SY=y=>y-cam.y+H/2;

    /* ───── 觸控按鈕 ───── */
    const BTN=[
      {id:'atk',x:W-78,y:H-86,r:44,t:'攻擊',f:attack,hold:true},
      {id:'use',x:W-170,y:H-60,r:32,t:'互動',f:interact},
      {id:'eat',x:W-188,y:H-140,r:26,t:'吃',f:eat},
      {id:'lamp',x:W-78,y:H-178,r:28,t:'燈',f:toggleLight}
    ];
    const hitBtn=(x,y)=>BTN.find(b=>Math.hypot(x-b.x,y-b.y)<b.r+6);

    /* ───── 碰撞 ───── */
    function solidPush(o,r){
      for(const t of trees){ if(t.hp<=0) continue; const dx=o.x-t.x, dy=o.y-t.y; if(Math.abs(dx)>50||Math.abs(dy)>50) continue; const d=Math.hypot(dx,dy), m=r+13; if(d<m&&d>0){ o.x=t.x+dx/d*m; o.y=t.y+dy/d*m; } }
      for(const t of rocks){ if(t.hp<=0) continue; const dx=o.x-t.x, dy=o.y-t.y, d=Math.hypot(dx,dy), m=r+18; if(d<m&&d>0){ o.x=t.x+dx/d*m; o.y=t.y+dy/d*m; } }
      const dx=o.x-CX, dy=o.y-CY, d=Math.hypot(dx,dy); if(d<34&&d>0){ o.x=CX+dx/d*34; o.y=CY+dy/d*34; }
      o.x=clamp(o.x,20,WS-20); o.y=clamp(o.y,20,WS-20);
    }

    return {
      onDown(x,y,id){
        if(!S.started) return;
        const b=hitBtn(x,y);
        if(b){ S.btnHeld[id]=b; b.f(); return; }
        if(x<W*.42&&y>H*.35&&!S.joy){ S.joy={id,sx:x,sy:y}; return; }
        if(!P.touch){ S.aim.x=x; S.aim.y=y; S.aim.mouse=true; attack(); S.btnHeld[id]={id:'atk',f:attack,hold:true}; }
        else { S.aim.mouse=false; attack(); }
      },
      onUp(id){ if(S.joy&&S.joy.id===id) S.joy=null; delete S.btnHeld[id]; },
      update(dt){
        if(S.over) return;
        if(!S.askedLoad){
          S.askedLoad=true;
          if(save&&save.day>1){
            const sv=save;
            showChoice('森林生存 99 夜','找到存檔：第 '+sv.day+' 天早上（已撐過 '+sv.night+' 夜）',[
              {name:'▶ 繼續存檔',desc:'從第 '+sv.day+' 天早上開始',go:1},{name:'↺ 重新開始',desc:'舊存檔會被覆蓋',go:0}],
              o=>{ if(o.go) applySave(sv); else { try{ localStorage.removeItem(SAVE_KEY); }catch(e){} } S.started=true; },'SAVE FOUND / 存檔');
            return;
          }
          S.started=true;
          toast('砍樹收集木頭，回營火按 E 丟進去。天黑前準備好！',4);
        }
        if(!S.started) return;
        const p=S.p;
        if(S.msgT>0) S.msgT-=dt;
        // 鍵盤
        if(tapped.has('e')||tapped.has('enter')) interact();
        if(tapped.has('q')) eat();
        if(tapped.has('f')) toggleLight();
        if(keys.has(' ')||keys.has('j')) attack();
        for(const id in S.btnHeld){ const b=S.btnHeld[id]; if(b.hold) b.f(); }
        if(!P.touch&&!S.joy){ S.aim.x=P.x; S.aim.y=P.y; }
        // 移動
        let a=axis(), mx=a.x, my=a.y;
        if(S.joy){ const q=PTRS.get(S.joy.id); if(q){ let dx=q.x-S.joy.sx, dy=q.y-S.joy.sy; const m=Math.hypot(dx,dy); if(m>8){ mx=dx/Math.max(m,60); my=dy/Math.max(m,60); } S.joy.x=q.x; S.joy.y=q.y; } }
        if(!P.touch&&(P.x!==S.lpx||P.y!==S.lpy)){ S.lpx=P.x; S.lpy=P.y; if(S.lpInit) S.aim.mouse=true; S.lpInit=true; }
        if(mx||my){ p.face=Math.atan2(my,mx); if(keys.size||S.joy) S.aim.mouse=false; }
        const spd=p.spd*(S.saved[3]?1.1:1)*(p.food<=0?.7:1);
        p.x+=(mx*spd+p.vx)*dt; p.y+=(my*spd+p.vy)*dt; p.vx*=Math.pow(.02,dt); p.vy*=Math.pow(.02,dt);
        solidPush(p,14);
        if(p.cd>0) p.cd-=dt; if(p.swing>0) p.swing-=dt; if(p.hurt>0) p.hurt-=dt;
        cam.x+=(p.x-cam.x)*Math.min(1,dt*8); cam.y+=(p.y-cam.y)*Math.min(1,dt*8);
        // 探索
        const ex=Math.floor(p.x/WS*EX), ey=Math.floor(p.y/WS*EX);
        for(let j=-2;j<=2;j++) for(let i=-2;i<=2;i++){ const X=ex+i,Y=ey+j; if(X>=0&&Y>=0&&X<EX&&Y<EX) explored[Y*EX+X]=1; }
        caves.forEach(c=>{ if(!c.found&&dist(c,p)<420){ c.found=true; toast('發現洞穴！裡面好像有小狐狸，但有狼王守著',3.2); } });
        // 時間
        const before=S.clock; S.clock+=dt;
        if(before<DAY&&S.clock>=DAY) nightfall();
        if(S.clock>=CYCLE){ dawn(); if(S.over) return; }
        // 營火
        const burn=(isNight()?.95:.55)*(D.key==='hard'?1.15:D.key==='easy'?.8:1);
        S.fire.fuel=Math.max(0,S.fire.fuel-burn*dt);
        // 狀態
        const nearFire=inFire(p.x,p.y,-10);
        p.food=Math.max(0,p.food-dt*(.42*(D.key==='hard'?1.2:D.key==='easy'?.8:1)));
        if(p.food<=0){ p.hp-=2.2*dt; if(Math.random()<dt*.5) toast('好餓……快吃點東西（Q）'); }
        const cold=isNight()&&!nearFire&&darkness()>.6;
        if(cold){ p.hp-=(1.1+S.night*.02)*DMG*dt; if(Math.random()<dt*.3) toast('好冷！夜裡要待在火光附近'); }
        if(nearFire&&p.food>40) p.hp=Math.min(p.max,p.hp+2.4*dt);
        if(p.hp<=0){ p.hp=0; die(); return; }
        // 手電筒
        if(S.light.on){ S.light.bat-=dt*(lightLv()===2?5:6.5); if(S.light.bat<=0){ S.light.bat=0; S.light.on=false; toast('手電筒沒電了，回營火旁邊充電'); } }
        if(nearFire) S.light.bat=Math.min(100,S.light.bat+dt*12);
        if(fireLv()>S.lv){ S.lv=fireLv(); Snd.power(); boom(W/2,H/2,'#ffb347',30,300); toast('🔥 營火升到 Lv'+S.lv+'！獲得 '+LVMSG[S.lv],4); }
        const LR=lightLv()===2?440:320, LA=lightLv()===2?.5:.36, LF=aimAngle();
        const lit=o=>S.light.on&&dist(o,p)<LR&&Math.abs(angDiff(Math.atan2(o.y-p.y,o.x-p.x),LF))<LA;
        // 小狐狸
        caves.forEach((c,i)=>{
          const cb=c.cub;
          if(cb.st==='follow'){
            const d=dist(cb,p); if(d>46){ cb.x+=(p.x-cb.x)/d*Math.min(d-40,260*dt); cb.y+=(p.y-cb.y)/d*Math.min(d-40,260*dt); }
            if(Math.hypot(cb.x-CX,cb.y-CY)<130){
              cb.st='saved'; S.saved[i]=true; S.cubs++; Snd.power(); boom(SX(cb.x),SY(cb.y),'#ff9d4d',30,260);
              const perk=['生命上限 +25','背包容量 +4','添柴經驗 +30%','移動與攻擊 +10%'][i];
              if(i===0){ p.max+=25; p.hp+=25; }
              toast('🦊 小狐狸回家了！（'+S.cubs+'/4）獎勵：'+perk,3.6);
            }
          }
        });
        // 影狼
        for(const w of wolves){
          if(w.dead) continue;
          const d=dist(w,p);
          w.t-=dt; if(w.cd>0) w.cd-=dt; if(w.hurt>0) w.hurt-=dt; if(w.flee>0) w.flee-=dt;
          let tx=0,ty=0,sp=0;
          const chaseR=w.home?260:(isNight()?520:240);
          if(lightLv()===2&&lit(w)&&!w.big) w.flee=Math.max(w.flee,.8);
          if(w.flee>0){ tx=w.x-p.x; ty=w.y-p.y; sp=190; }
          else if(d<chaseR&&!(w.home&&dist(w,w.home)>520)){ tx=p.x-w.x; ty=p.y-w.y; sp=(w.big?150:175)*D.spd+Math.min(55,S.night*.8); }
          else if(w.home&&dist(w,w.home)>120){ tx=w.home.x-w.x; ty=w.home.y+60-w.y; sp=110; }
          else { if(w.t<=0){ w.t=rnd(1,3); w.a=rnd(0,TAU); } tx=Math.cos(w.a); ty=Math.sin(w.a); sp=60; }
          const m=Math.hypot(tx,ty)||1;
          let nx=w.x+(tx/m*sp+w.vx)*dt, ny=w.y+(ty/m*sp+w.vy)*dt;
          w.vx*=Math.pow(.02,dt); w.vy*=Math.pow(.02,dt);
          if(inFire(nx,ny,8)||inFence(nx,ny)){
            const a=Math.atan2(w.y-CY,w.x-CX)+.9*dt; const rr=Math.max(Math.hypot(w.x-CX,w.y-CY),fenced()?300:fireR()+10);
            nx=CX+Math.cos(a)*rr; ny=CY+Math.sin(a)*rr;
          }
          w.x=clamp(nx,20,WS-20); w.y=clamp(ny,20,WS-20);
          if(d<(w.big?40:32)&&w.cd<=0&&w.flee<=0){ w.cd=1.05; hurt(w.big?14:8,w); }
        }
        for(let i=wolves.length-1;i>=0;i--) if(wolves[i].dead) wolves.splice(i,1);
        if(isNight()&&Math.random()<dt*.05*(1+S.night/25)&&wolves.length<40){
          const a=rnd(0,TAU); const x=clamp(p.x+Math.cos(a)*900,40,WS-40), y=clamp(p.y+Math.sin(a)*900,40,WS-40);
          if(!inFire(x,y,80)) wolves.push(mkWolf(x,y,false,null));
        }
        // 霧角獸
        if(beast.on){
          const d=dist(beast,p);
          if(d<700&&!S.beastWarned){ S.beastWarned=true; toast('⚠ 霧角獸在附近……牠只怕火光和手電筒',3.2); }
          if(beast.cd>0) beast.cd-=dt;
          if(beast.wait>0){ beast.wait-=dt; }
          else {
          if(lit(beast)&&beast.stun<=0&&beast.flee<=0){ beast.stun=1.7; Snd.bad(); ftext(SX(beast.x),SY(beast.y)-60,'被照到了！','#eaf6ff'); }
          if(beast.stun>0){ beast.stun-=dt; if(beast.stun<=0) beast.flee=3.2; }
          else {
            let tx=p.x-beast.x, ty=p.y-beast.y, sp=(118+Math.min(80,S.night*.9))*D.spd;
            if(beast.flee>0){ beast.flee-=dt; tx=-tx; ty=-ty; sp=240; }
            const m=Math.hypot(tx,ty)||1; let nx=beast.x+tx/m*sp*dt, ny=beast.y+ty/m*sp*dt;
            if(inFire(nx,ny,30)){ nx=beast.x; ny=beast.y; }
            beast.x=clamp(nx,20,WS-20); beast.y=clamp(ny,20,WS-20);
            if(d<44&&beast.cd<=0&&beast.flee<=0){ beast.cd=2; hurt(26,beast); beast.flee=4; toast('被霧角獸抓傷了！'); }
          }
          }
        }
        // 撿東西提示
        const n=nearest();
        S.tip=n?({item:'E 撿起'+(n.type==='item'?ITEM[n.o.k].n:''),bush:'E 採莓果',chest:'E 打開寶箱',cub:'E 帶小狐狸回家',fire:'E 添柴（木頭/煤塊）'})[n.type]:'';
        setHUD({'夜晚':isNight()?{t:'第 '+S.night+' 夜',c:'acc'}:'第 '+S.day+' 天','生命':Math.ceil(p.hp)+'/'+p.max,
          '飽食':{t:Math.ceil(p.food)+'%',c:p.food<25?'acc':''},'營火':'Lv'+fireLv()+' · '+Math.ceil(S.fire.fuel)+'%'});
      },
      draw(){
        const p=S.p, dk=darkness();
        // 地面
        ctx.fillStyle='#1d3a24'; ctx.fillRect(0,0,W,H);
        const x0=cam.x-W/2-60, x1=cam.x+W/2+60, y0=cam.y-H/2-60, y1=cam.y+H/2+60;
        const vis=o=>o.x>x0&&o.x<x1&&o.y>y0&&o.y<y1;
        for(const g of decor){ if(!vis(g)) continue; const x=SX(g.x), y=SY(g.y);
          if(g.k==='g'){ ctx.strokeStyle=g.c<.5?'#2c5534':'#27492f'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x-3,y-8); ctx.moveTo(x+3,y); ctx.lineTo(x+5,y-7); ctx.stroke(); }
          else { ctx.fillStyle=g.c<.3?'#ffd83d':g.c<.6?'#f0a0ff':'#eaf0ff'; ctx.beginPath(); ctx.arc(x,y,2.4,0,TAU); ctx.fill(); } }
        // 世界邊界
        ctx.strokeStyle='rgba(0,0,0,.5)'; ctx.lineWidth=40; ctx.strokeRect(SX(0)-20,SY(0)-20,WS+40,WS+40);
        // 營地地面
        ctx.fillStyle='rgba(120,90,50,.35)'; ctx.beginPath(); ctx.arc(SX(CX),SY(CY),150,0,TAU); ctx.fill();
        if(fenced()){ ctx.strokeStyle='#ffb347'; ctx.lineWidth=7; ctx.setLineDash([14,10]); ctx.beginPath(); ctx.arc(SX(CX),SY(CY),300,0,TAU); ctx.stroke(); ctx.setLineDash([]); }
        // 洞穴
        for(const c of caves){ if(!vis({x:c.x,y:c.y})&&Math.abs(c.x-cam.x)>700) continue; const x=SX(c.x), y=SY(c.y);
          ctx.fillStyle='#3b3f4d'; ctx.beginPath(); ctx.ellipse(x,y-10,95,70,0,0,TAU); ctx.fill();
          ctx.fillStyle='#0d0f16'; ctx.beginPath(); ctx.ellipse(x,y+6,48,34,0,Math.PI,0); ctx.lineTo(x+48,y+22); ctx.lineTo(x-48,y+22); ctx.fill(); }
        // 物件（依 y 排序）
        const list=[];
        rocks.forEach(o=>{ if(o.hp>0&&vis(o)) list.push({y:o.y,f:()=>{ const x=SX(o.x),y=SY(o.y)+(o.shake>0?rnd(-2,2):0); ctx.fillStyle='#6d7488'; ctx.beginPath(); ctx.ellipse(x,y,24,17,0,0,TAU); ctx.fill(); ctx.fillStyle='#2a2f3a'; [[-8,-3],[6,2],[-1,6]].forEach(q=>{ ctx.beginPath(); ctx.arc(x+q[0],y+q[1],3.5,0,TAU); ctx.fill(); }); }}); });
        bushes.forEach(o=>{ if(vis(o)) list.push({y:o.y,f:()=>{ const x=SX(o.x),y=SY(o.y); ctx.fillStyle='#2f6b3a'; ctx.beginPath(); ctx.arc(x-8,y,13,0,TAU); ctx.arc(x+8,y,13,0,TAU); ctx.arc(x,y-8,13,0,TAU); ctx.fill();
          if(o.full){ ctx.fillStyle='#ff4f7a'; [[-9,-2],[7,-7],[3,4],[-2,-12],[11,3]].forEach(q=>{ ctx.beginPath(); ctx.arc(x+q[0],y+q[1],4,0,TAU); ctx.fill(); }); } }}); });
        chests.forEach(o=>{ if(vis(o)) list.push({y:o.y,f:()=>{ const x=SX(o.x),y=SY(o.y); ctx.fillStyle=o.open?'#5a3d22':'#8a5a2e'; ctx.fillRect(x-16,y-10,32,20); ctx.fillStyle=o.open?'#2a1c10':'#ffd83d'; ctx.fillRect(x-16,y-10,32,5); if(!o.open){ ctx.fillRect(x-3,y-4,6,7); } }}); });
        items.forEach(o=>{ if(vis(o)) list.push({y:o.y,f:()=>{ const x=SX(o.x),y=SY(o.y)+Math.sin(G.time*3+o.bob)*2; const it=ITEM[o.k];

          else { ctx.beginPath(); poly(x,y,7,o.k==='coal'?5:12,G.time); ctx.fill(); } }}); });
        // 營地
        list.push({y:TENT.y,f:()=>{ const x=SX(TENT.x),y=SY(TENT.y); ctx.fillStyle='#c0503c'; ctx.beginPath(); ctx.moveTo(x-40,y+22); ctx.lineTo(x,y-30); ctx.lineTo(x+40,y+22); ctx.fill(); ctx.fillStyle='#5a1f16'; ctx.beginPath(); ctx.moveTo(x-10,y+22); ctx.lineTo(x,y-4); ctx.lineTo(x+10,y+22); ctx.fill(); }});
        list.push({y:CY,f:()=>{ const x=SX(CX),y=SY(CY); ctx.fillStyle='#6b6f7a'; for(let i=0;i<10;i++){ const a=i/10*TAU; ctx.beginPath(); ctx.arc(x+Math.cos(a)*26,y+Math.sin(a)*18,7,0,TAU); ctx.fill(); }
          ctx.fillStyle='#5a3a1f'; ctx.save(); ctx.translate(x,y); ctx.rotate(.5); ctx.fillRect(-18,-4,36,8); ctx.rotate(-1); ctx.fillRect(-18,-4,36,8); ctx.restore();
          if(S.fire.fuel>0){ const s=.5+.5*Math.min(1,S.fire.fuel/60)+fireLv()*.08, f=Math.sin(G.time*14)*2;
            ctx.fillStyle='#ff7a2f'; ctx.beginPath(); ctx.moveTo(x-16*s,y); ctx.quadraticCurveTo(x+f,y-58*s,x+16*s,y); ctx.fill();

        caves.forEach(c=>{ const cb=c.cub; if(cb.st==='saved'||!vis(cb)) return; list.push({y:cb.y,f:()=>{ const x=SX(cb.x),y=SY(cb.y);
          ctx.fillStyle='#ff9d4d'; ctx.beginPath(); ctx.ellipse(x,y,12,9,0,0,TAU); ctx.fill(); ctx.beginPath(); ctx.arc(x+10,y-7,8,0,TAU); ctx.fill();
          ctx.beginPath(); ctx.moveTo(x+5,y-13); ctx.lineTo(x+8,y-21); ctx.lineTo(x+11,y-13); ctx.moveTo(x+11,y-13); ctx.lineTo(x+16,y-20); ctx.lineTo(x+17,y-11); ctx.fill();
          ctx.fillStyle='#fff'; ctx.beginPath(); ctx.ellipse(x-13,y+2,6,4,.5,0,TAU); ctx.fill(); ctx.fillStyle='#050919'; ctx.beginPath(); ctx.arc(x+12,y-8,1.6,0,TAU); ctx.fill();
          if(cb.st==='wait'){ ctx.fillStyle='#ffd83d'; ctx.font='900 16px '+FONT_TC; ctx.textAlign='center'; ctx.fillText('!',x,y-28+Math.sin(G.time*5)*3); ctx.textAlign='left'; } }}); });
        wolves.forEach(w=>{ if(vis(w)) list.push({y:w.y,f:()=>{ const x=SX(w.x),y=SY(w.y), s=w.big?1.6:1, fa=Math.atan2(p.y-w.y,p.x-w.x);
          ctx.save(); ctx.translate(x,y); ctx.scale(Math.cos(fa)<0?-1:1,1);
          ctx.fillStyle=w.hurt>0?'#fff':w.big?'#3a2f4d':'#2b3040'; ctx.beginPath(); ctx.ellipse(0,0,20*s,10*s,0,0,TAU); ctx.fill();
          ctx.beginPath(); ctx.arc(18*s,-6*s,8*s,0,TAU); ctx.fill(); ctx.beginPath(); ctx.moveTo(14*s,-12*s); ctx.lineTo(17*s,-20*s); ctx.lineTo(21*s,-12*s); ctx.fill();
          ctx.beginPath(); ctx.moveTo(-18*s,-2*s); ctx.lineTo(-30*s,-9*s); ctx.lineTo(-20*s,4*s); ctx.fill();
          ctx.fillStyle=w.big?'#ff5f96':'#ffd83d'; ctx.shadowColor=ctx.fillStyle; ctx.shadowBlur=10; ctx.beginPath(); ctx.arc(21*s,-8*s,2.2*s,0,TAU); ctx.fill(); ctx.shadowBlur=0;
          ctx.restore();
          if(w.hp<w.max) bar(x-18,y-24*s,36,4,w.hp/w.max,'#ff5f96'); }}); });
        if(beast.on&&vis(beast)) list.push({y:beast.y,f:()=>{ const x=SX(beast.x),y=SY(beast.y), sh=beast.stun>0?rnd(-2,2):0;
          for(let i=0;i<5;i++){ ctx.fillStyle='rgba(200,215,255,.06)'; ctx.beginPath(); ctx.arc(x+Math.sin(G.time*2+i)*24,y+12+Math.cos(G.time*1.7+i)*10,30,0,TAU); ctx.fill(); }
          ctx.fillStyle='#0b0d18'; ctx.beginPath(); ctx.ellipse(x+sh,y,20,34,0,0,TAU); ctx.fill(); ctx.beginPath(); ctx.arc(x+sh,y-38,14,0,TAU); ctx.fill();
          ctx.strokeStyle='#c9cfe0'; ctx.lineWidth=3; ctx.beginPath();
          ctx.moveTo(x-8,y-48); ctx.lineTo(x-20,y-72); ctx.lineTo(x-30,y-80); ctx.moveTo(x-20,y-72); ctx.lineTo(x-14,y-86);
          ctx.moveTo(x+8,y-48); ctx.lineTo(x+20,y-72); ctx.lineTo(x+30,y-80); ctx.moveTo(x+20,y-72); ctx.lineTo(x+14,y-86); ctx.stroke();
          ctx.fillStyle='#fff'; ctx.shadowColor='#fff'; ctx.shadowBlur=14; ctx.beginPath(); ctx.arc(x-5+sh,y-40,2.8,0,TAU); ctx.arc(x+5+sh,y-40,2.8,0,TAU); ctx.fill(); ctx.shadowBlur=0; }});
        // 玩家
        list.push({y:p.y,f:()=>{ const x=SX(p.x),y=SY(p.y), A=p.swing>0?p.swA:aimAngle();
          ctx.fillStyle='rgba(0,0,0,.3)'; ctx.beginPath(); ctx.ellipse(x,y+14,14,5,0,0,TAU); ctx.fill();
          ctx.fillStyle='#4a6fa5'; ctx.fillRect(x-7,y-2,14,16);
          ctx.fillStyle=p.hurt>0?'#ff9d9d':'#ffd9b0'; ctx.beginPath(); ctx.arc(x,y-10,11,0,TAU); ctx.fill();
          ctx.fillStyle='#e04a3a'; ctx.beginPath(); ctx.arc(x,y-13,11,Math.PI,0); ctx.fill(); ctx.fillRect(x-13,y-14,26,4);
          ctx.fillStyle='#8a5a2e'; ctx.fillRect(x-(Math.cos(A)>0?13:-5),y-2,8,12);
          const sw=p.swing>0?(p.swing/.22):0, ang=A+(sw?(-1.2+2.4*(1-sw)):.6);
          ctx.save(); ctx.translate(x,y); ctx.rotate(ang); ctx.fillStyle='#7a5230'; ctx.fillRect(6,-2,26,4);
          ctx.fillStyle=['#aaa','#9aa3b2','#cfd8e8','#7ae8ff'][axeLv()]; ctx.beginPath(); ctx.moveTo(26,-2); ctx.lineTo(36,-10); ctx.lineTo(38,4); ctx.lineTo(28,2); ctx.fill(); ctx.restore();
          if(sw){ ctx.strokeStyle='rgba(255,255,255,'+(sw*.5)+')'; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(x,y,40,A-1,A+1); ctx.stroke(); } }});
        // 樹（最後依 y 排入，樹冠蓋住後面的東西）
        trees.forEach(t=>{ if(!vis(t)) return; list.push({y:t.y,f:()=>{ const x=SX(t.x)+(t.shake>0?rnd(-3,3):0),y=SY(t.y);
          if(t.hp<=0){ ctx.fillStyle='#6b4a2b'; ctx.beginPath(); ctx.ellipse(x,y,11,7,0,0,TAU); ctx.fill(); ctx.fillStyle='#caa27a'; ctx.beginPath(); ctx.ellipse(x,y-2,8,5,0,0,TAU); ctx.fill(); return; }
          ctx.fillStyle='rgba(0,0,0,.28)'; ctx.beginPath(); ctx.ellipse(x+6,y+8,t.r*.9,t.r*.4,0,0,TAU); ctx.fill();
          ctx.fillStyle='#5a3a1f'; ctx.fillRect(x-6,y-18,12,26);
          const sw=Math.sin(G.time*1.3+t.sway)*2, g=36+t.tint;
          ctx.fillStyle='hsl(140,40%,'+(14+t.tint*.3)+'%)'; ctx.beginPath(); ctx.arc(x+sw,y-30,t.r,0,TAU); ctx.fill();
          ctx.fillStyle='hsl(135,42%,'+(20+t.tint*.3)+'%)'; ctx.beginPath(); ctx.arc(x+sw-t.r*.25,y-36,t.r*.7,0,TAU); ctx.fill();
          ctx.fillStyle='hsla(120,50%,40%,.25)'; ctx.beginPath(); ctx.arc(x+sw-t.r*.35,y-42,t.r*.35,0,TAU); ctx.fill();
          if(t.hp<4) bar(x-16,y-30-t.r-8,32,4,t.hp/4,'#ffd83d'); }}); });
        list.sort((a,b)=>a.y-b.y).forEach(o=>o.f());
        // 暗夜光影
        if(dk>0){
          const L=ensureDark();
          const c=L.getContext('2d');
          c.globalCompositeOperation='source-over'; c.clearRect(0,0,W,H);
          c.fillStyle='rgba(3,6,20,'+dk+')'; c.fillRect(0,0,W,H);
          c.globalCompositeOperation='destination-out';
          const hole=(x,y,r,a)=>{ const g=c.createRadialGradient(x,y,r*.35,x,y,r); g.addColorStop(0,'rgba(0,0,0,'+(a||1)+')'); g.addColorStop(1,'rgba(0,0,0,0)'); c.fillStyle=g; c.beginPath(); c.arc(x,y,r,0,TAU); c.fill(); };
          const fr=fireR(); if(fr>0) hole(SX(CX),SY(CY),fr*(1+Math.sin(G.time*9)*.02));
          hole(SX(p.x),SY(p.y),95,.75);
          if(S.light.on){ const LR=lightLv()===2?440:320, LA=lightLv()===2?.5:.36, A=aimAngle(), x=SX(p.x), y=SY(p.y);
            const g=c.createRadialGradient(x,y,20,x,y,LR); g.addColorStop(0,'rgba(0,0,0,.95)'); g.addColorStop(1,'rgba(0,0,0,0)');
            c.fillStyle=g; c.beginPath(); c.moveTo(x,y); c.arc(x,y,LR,A-LA,A+LA); c.closePath(); c.fill(); }
          c.globalCompositeOperation='source-over';
          ctx.drawImage(L,0,0,W,H);
          if(fr>0){ ctx.save(); ctx.globalCompositeOperation='lighter'; const g=ctx.createRadialGradient(SX(CX),SY(CY),10,SX(CX),SY(CY),fr*.8); g.addColorStop(0,'rgba(255,150,60,'+(.22*dk)+')'); g.addColorStop(1,'rgba(255,120,40,0)'); ctx.fillStyle=g; ctx.fillRect(0,0,W,H); ctx.restore(); }
          // 黑暗中的眼睛
          for(const w of wolves){ if(!vis(w)) continue; ctx.fillStyle=w.big?'rgba(255,95,150,.9)':'rgba(255,216,61,.85)'; ctx.beginPath(); ctx.arc(SX(w.x)+(p.x>w.x?18:-18)*(w.big?1.6:1),SY(w.y)-8*(w.big?1.6:1),2.4,0,TAU); ctx.fill(); }
          if(beast.on&&vis(beast)){ ctx.fillStyle='rgba(255,255,255,.95)'; ctx.beginPath(); ctx.arc(SX(beast.x)-5,SY(beast.y)-40,2.8,0,TAU); ctx.arc(SX(beast.x)+5,SY(beast.y)-40,2.8,0,TAU); ctx.fill(); }
        }
        drawUI();
      }
    };

    /* ───── 夜色圖層 ───── */
    function ensureDark(){ if(!darkCv){ darkCv=document.createElement('canvas'); darkCv.width=W; darkCv.height=H; } return darkCv; }

    /* ───── 介面 ───── */
    function drawUI(){
      const p=S.p;
      ctx.save();
      // 日夜時鐘
      const night=isNight(), t=night?(S.clock-DAY)/NIGHT:S.clock/DAY;
      ctx.fillStyle='rgba(5,9,25,.72)'; RR(W/2-150,10,300,40,10); ctx.fill();
      ctx.font='900 15px '+FONT_TC; ctx.textAlign='center'; ctx.fillStyle=night?'#c9d3ff':'#ffd83d';
      ctx.fillText((night?'🌙 第 '+S.night+' 夜':'☀ 第 '+S.day+' 天')+'　/ 目標 '+GOAL+' 夜',W/2,28);
      bar(W/2-130,36,260,6,night?1-t:1-t,night?'#7aa7ff':'#ffd83d');
      // 左上狀態
      ctx.textAlign='left';
      ctx.fillStyle='rgba(5,9,25,.72)'; RR(10,10,200,86,10); ctx.fill();
      ctx.font='700 12px '+FONT_TC;
      const row=(y,lab,v,col)=>{ ctx.fillStyle='#9aa6d6'; ctx.fillText(lab,20,y+9); bar(62,y,138,10,v,col); };
      row(20,'生命',p.hp/p.max,p.hp<30?'#ff5f96':'#57e2a5');
      row(40,'飽食',p.food/100,'#ff9d4d');
      row(60,'營火',S.fire.fuel/100,S.fire.fuel<20?'#ff5f96':'#ffb347');
      ctx.fillStyle='#9aa6d6'; ctx.fillText('🦊 '+S.cubs+'/4　營火 Lv'+fireLv()+'　🔦'+Math.ceil(S.light.bat)+'%',20,90);
      // 迷你地圖
      const mx=W-142, my=10, ms=130;
      ctx.fillStyle='rgba(5,9,25,.8)'; RR(mx-4,my-4,ms+8,ms+8,8); ctx.fill();
      ctx.fillStyle='#1d3a24';
      for(let j=0;j<EX;j++) for(let i=0;i<EX;i++) if(explored[j*EX+i]) ctx.fillRect(mx+i*ms/EX,my+j*ms/EX,ms/EX+.5,ms/EX+.5);
      ctx.fillStyle='#ffb347'; ctx.beginPath(); ctx.arc(mx+CX/WS*ms,my+CY/WS*ms,3.5,0,TAU); ctx.fill();
      caves.forEach(c=>{ if(!c.found) return; ctx.fillStyle=c.cub.st==='saved'?'#57e2a5':'#ff9d4d'; ctx.fillRect(mx+c.x/WS*ms-3,my+c.y/WS*ms-3,6,6); });
      if(beast.on&&dist(beast,p)<900){ ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(mx+beast.x/WS*ms,my+beast.y/WS*ms,2.5,0,TAU); ctx.fill(); }
      ctx.fillStyle='#ffd83d'; ctx.beginPath(); ctx.arc(mx+p.x/WS*ms,my+p.y/WS*ms,3,0,TAU); ctx.fill();
      // 營火方向箭頭
      const dc=Math.hypot(CX-p.x,CY-p.y);
      if(dc>520){ const a=Math.atan2(CY-p.y,CX-p.x), ax=W/2+Math.cos(a)*210, ay=H/2+Math.sin(a)*190;
        ctx.save(); ctx.translate(ax,ay); ctx.rotate(a); ctx.fillStyle='rgba(255,179,71,.85)'; ctx.beginPath(); ctx.moveTo(14,0); ctx.lineTo(-8,-9); ctx.lineTo(-8,9); ctx.fill(); ctx.restore();
        ctx.fillStyle='rgba(255,179,71,.9)'; ctx.font='700 11px '+FONT_TC; ctx.textAlign='center'; ctx.fillText('營火 '+Math.round(dc/10)+'m',ax,ay+22); ctx.textAlign='left'; }
      // 背包
      const used=sackUsed(), cap=sackCap(), ks=ORDER.filter(k=>S.inv[k]>0);
      const bw=Math.max(170,ks.length*62+90), bx=W/2-bw/2, by=H-54;
      ctx.fillStyle='rgba(5,9,25,.78)'; RR(bx,by,bw,44,10); ctx.fill();
      ctx.fillStyle=used>=cap?'#ff5f96':'#9aa6d6'; ctx.font='700 12px '+FONT_TC; ctx.fillText('背包 '+used+'/'+cap,bx+10,by+27);
      ks.forEach((k,i)=>{ const x=bx+84+i*62; ctx.fillStyle=ITEM[k].c; ctx.beginPath(); ctx.arc(x+8,by+22,8,0,TAU); ctx.fill(); ctx.fillStyle='#eaf0ff'; ctx.font='700 12px '+FONT_TC; ctx.fillText(ITEM[k].n+S.inv[k],x+19,by+27); });
      // 提示
      if(S.tip){ ctx.font='700 14px '+FONT_TC; ctx.textAlign='center'; const tw=ctx.measureText(S.tip).width+24;
        ctx.fillStyle='rgba(5,9,25,.8)'; RR(W/2-tw/2,H/2+44,tw,28,8); ctx.fill(); ctx.fillStyle='#ffd83d'; ctx.fillText(S.tip,W/2,H/2+63); ctx.textAlign='left'; }
      if(S.msgT>0){ ctx.globalAlpha=clamp(S.msgT,0,1); ctx.font='900 17px '+FONT_TC; ctx.textAlign='center'; const tw=ctx.measureText(S.msg).width+30;
        ctx.fillStyle='rgba(5,9,25,.85)'; RR(W/2-tw/2,64,tw,34,10); ctx.fill(); ctx.fillStyle='#eaf0ff'; ctx.fillText(S.msg,W/2,87); ctx.globalAlpha=1; ctx.textAlign='left'; }
      // 觸控按鈕
      ctx.textAlign='center';
      for(const b of BTN){
        const dim=(b.id==='lamp'&&S.light.bat<=1)||(b.id==='eat'&&!S.inv.berry);
        ctx.fillStyle=b.id==='atk'?'rgba(255,95,150,.32)':'rgba(122,167,255,.26)'; if(dim) ctx.fillStyle='rgba(120,130,160,.14)';
        ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,TAU); ctx.fill(); ctx.strokeStyle='rgba(234,240,255,.35)'; ctx.lineWidth=2; ctx.stroke();
        ctx.fillStyle=dim?'rgba(234,240,255,.35)':'#eaf0ff'; ctx.font='900 '+(b.r>40?16:13)+'px '+FONT_TC; ctx.fillText(b.id==='lamp'&&S.light.on?'關燈':b.t,b.x,b.y+5);
      }
      if(S.joy){ ctx.strokeStyle='rgba(234,240,255,.3)'; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(S.joy.sx,S.joy.sy,56,0,TAU); ctx.stroke();
        ctx.fillStyle='rgba(234,240,255,.35)'; const dx=(S.joy.x||S.joy.sx)-S.joy.sx, dy=(S.joy.y||S.joy.sy)-S.joy.sy, m=Math.min(1,56/(Math.hypot(dx,dy)||1));
        ctx.beginPath(); ctx.arc(S.joy.sx+dx*m,S.joy.sy+dy*m,24,0,TAU); ctx.fill(); }
      else if(P.touch){ ctx.fillStyle='rgba(234,240,255,.25)'; ctx.font='700 12px '+FONT_TC; ctx.fillText('左下拖曳移動',110,H-24); }
      ctx.textAlign='left';
      ctx.restore();
    }
  }
});
})();


/* ═══════════════ 啟動 ═══════════════ */
window.arcade={setDiff:d=>{ G.diff=DIFFS[d]; },newKeys:()=>NEWG.map(g=>g.key),art:k=>{ const g=byKey(k); const c=document.createElement('canvas'); c.width=320; c.height=200; g.art(c.getContext('2d'),320,200); return c.toDataURL(); },
  count:()=>GAMES.length,keys:()=>GAMES.map(g=>g.key),play:k=>{goBrowse();openGame(byKey(k));},state:()=>G.state};
function boot(){
  initGames();
  goBrowse();
  requestAnimationFrame(frame);
}
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(boot).catch(boot);
else boot();

})();
</script>
